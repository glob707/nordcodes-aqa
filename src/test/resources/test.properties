# Путь к тестируемому JAR (относительно корня проекта)
app.jar=app/internal-0.0.1-SNAPSHOT.jar
# API-ключ, с которым запускается приложение (-Dsecret)
app.secret=qazWSXedc
# Порт приложения. 0 — выбрать свободный порт автоматически
app.port=0
# Сколько ждать старта приложения
app.startup.timeout.seconds=90
# Адрес уже запущенного приложения. Если задан, тесты не запускают JAR сами,
# а mock.port должен совпадать с портом из параметра -Dmock этого приложения
app.url=
# Порт WireMock (имитация внешнего сервиса). 0 — выбрать свободный порт автоматически
mock.port=0
# Таймаут чтения ответа внешнего сервиса, заданный в приложении (выявлен при исследовании)
external.read.timeout.seconds=10
